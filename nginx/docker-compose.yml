services:
  nginx:
    image: nginx:1.27.4-alpine
    container_name: nginx
    ports:
      - "8090:80"
    volumes:
      - ./data:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - tcc

networks:
  tcc:
    external: true
    name: tcc
